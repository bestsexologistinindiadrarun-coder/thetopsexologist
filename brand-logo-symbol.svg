<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Male and female health symbol logo</title>
  <desc id="desc">A clean medical logo formed from interlinked male and female symbols in blue and green.</desc>
  <defs>
    <linearGradient id="blue" x1="98" y1="104" x2="350" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B4F8A"/>
      <stop offset="1" stop-color="#073B6B"/>
    </linearGradient>
    <linearGradient id="green" x1="159" y1="363" x2="423" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#118A5B"/>
      <stop offset="1" stop-color="#31B77A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#F7FBFF"/>
  <g filter="url(#shadow)">
    <circle cx="230" cy="232" r="120" fill="#FFFFFF" stroke="url(#blue)" stroke-width="34"/>
    <circle cx="295" cy="232" r="120" fill="none" stroke="url(#green)" stroke-width="34"/>
    <path d="M380 147 L438 89" fill="none" stroke="url(#green)" stroke-width="34" stroke-linecap="round"/>
    <path d="M398 89 H438 V129" fill="none" stroke="url(#green)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M230 352 V424" fill="none" stroke="url(#blue)" stroke-width="34" stroke-linecap="round"/>
    <path d="M183 388 H277" fill="none" stroke="url(#blue)" stroke-width="34" stroke-linecap="round"/>
  </g>
  <path d="M159 319 C190 353 237 374 287 367 C330 361 365 338 389 307" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" opacity=".9"/>
</svg>
